<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MCAS Medieval Science Knight Quest</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Georgia, serif;
}

/* GAME AREA */

#gameWorld{
    width:1600px;
    height:900px;
    position:relative;
    overflow:hidden;
}

/* HUD */

#hud{
    position:fixed;
    top:10px;
    left:10px;

    z-index:9999;

    background:rgba(0,0,0,.7);

    color:white;

    padding:12px;

    border-radius:10px;

    font-size:20px;
}

/* KNIGHT */

#hero{
    width:55px;
    height:55px;

    position:absolute;

    left:40px;
    top:40px;

    font-size:50px;

    text-align:center;
    line-height:55px;

    animation:knightWalk .5s infinite;
}

@keyframes knightWalk{
    0%{transform:translateY(0);}
    50%{transform:translateY(-4px);}
    100%{transform:translateY(0);}
}

/* WALLS */

.wall{
    position:absolute;
    background:#222;
}

/* ENEMIES */

.enemy{
    position:absolute;

    width:55px;
    height:55px;

    font-size:50px;

    text-align:center;
    line-height:55px;

    animation:enemyFloat 1s infinite;
}

@keyframes enemyFloat{
    0%{transform:translateY(0);}
    50%{transform:translateY(-6px);}
    100%{transform:translateY(0);}
}

/* BOSS */

#boss{
    position:absolute;

    width:100px;
    height:100px;

    font-size:90px;

    text-align:center;
    line-height:100px;

    display:none;

    animation:bossFloat 1s infinite;
}

@keyframes bossFloat{
    0%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
    100%{transform:translateY(0);}
}

/* TREASURE */

#treasure{
    position:absolute;
    font-size:90px;
    display:none;
}

/* QUESTIONS */

#dialogueBox{
    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:500px;

    background:white;

    padding:20px;

    border-radius:15px;

    display:none;

    z-index:99999;
}

.choiceBtn{
    width:100%;
    padding:12px;
    margin:10px 0;
    cursor:pointer;
}

#message{
    position:fixed;

    bottom:20px;
    left:50%;

    transform:translateX(-50%);

    background:rgba(0,0,0,.7);

    color:white;

    padding:10px 20px;

    border-radius:10px;

    font-size:22px;
}

</style>
</head>

<body>

<!-- AUDIO -->

<audio id="correctSound">
<source src="https://actions.google.com/sounds/v1/cartoon/pop.ogg">
</audio>

<audio id="wrongSound">
<source src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg">
</audio>

<audio id="bossSound">
<source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>

<!-- HUD -->

<div id="hud">

<div>❤️ Health: <span id="health">100</span></div>

<div>⭐ Score: <span id="score">0</span></div>

<div>🏰 Level: <span id="level">1</span></div>

<div>⚔️ Villains Defeated: <span id="villainsDefeated">0</span></div>

</div>

<!-- GAME -->

<div id="gameWorld">

<div id="hero">🛡️</div>

<div id="boss">👹</div>

<div id="treasure">💎</div>

</div>

<!-- QUESTIONS -->

<div id="dialogueBox">

<h2 id="questionText"></h2>

<div id="choices"></div>

<button onclick="closeDialogue()">Close</button>

</div>

<div id="message"></div>

<script>

/* LEVELS */

const levels = [

{
color:"#355e2b",
boss:"🐉",

enemies:[

{
x:250,
y:120,
sprite:"🧙",
question:{
question:"What force keeps objects on Earth?",
choices:["Gravity","Magnetism","Electricity","Friction"],
answer:"Gravity"
}
},

{
x:500,
y:350,
sprite:"💀",
question:{
question:"What type of energy is energy of motion?",
choices:["Chemical","Potential","Thermal","Kinetic"],
answer:"Kinetic"
}
},

{
x:850,
y:180,
sprite:"👺",
question:{
question:"What process turns liquid water into vapor?",
choices:["Condensation","Evaporation","Freezing","Melting"],
answer:"Evaporation"
}
}

],

walls:[

{x:200,y:0,w:20,h:700},
{x:500,y:200,w:20,h:700},
{x:850,y:0,w:20,h:700}

]

},

{
color:"#5b3a1a",
boss:"🪨",

enemies:[

{
x:300,
y:200,
sprite:"🧟",
question:{
question:"Which rock forms from cooled lava?",
choices:["Igneous","Sedimentary","Metamorphic","Fossil"],
answer:"Igneous"
}
},

{
x:700,
y:400,
sprite:"🦂",
question:{
question:"Which layer of Earth is liquid?",
choices:["Crust","Mantle","Outer Core","Inner Core"],
answer:"Outer Core"
}
},

{
x:1100,
y:250,
sprite:"🦇",
question:{
question:"What causes day and night?",
choices:["Moon orbit","Earth rotation","Sun movement","Gravity"],
answer:"Earth rotation"
}
}

],

walls:[

{x:250,y:0,w:20,h:800},
{x:650,y:150,w:20,h:800},
{x:1000,y:0,w:20,h:800}

]

},

{
color:"#223f63",
boss:"👿",

enemies:[

{
x:350,
y:120,
sprite:"🧛",
question:{
question:"What controls what enters and exits a cell?",
choices:["Nucleus","Membrane","Ribosome","Cytoplasm"],
answer:"Membrane"
}
},

{
x:750,
y:500,
sprite:"🧌",
question:{
question:"Which organelle produces energy?",
choices:["Mitochondria","Cell wall","Membrane","Nucleus"],
answer:"Mitochondria"
}
},

{
x:1200,
y:200,
sprite:"🐍",
question:{
question:"What gas do plants use for photosynthesis?",
choices:["Oxygen","Nitrogen","Carbon Dioxide","Hydrogen"],
answer:"Carbon Dioxide"
}
}

],

walls:[

{x:200,y:0,w:20,h:850},
{x:600,y:100,w:20,h:850},
{x:1000,y:0,w:20,h:850}

]

},

{
color:"#4a1f5c",
boss:"😈",

enemies:[

{
x:250,
y:180,
sprite:"👾",
question:{
question:"Which particle has a negative charge?",
choices:["Electron","Proton","Neutron","Nucleus"],
answer:"Electron"
}
},

{
x:700,
y:420,
sprite:"🤖",
question:{
question:"What process do plants use to make food?",
choices:["Respiration","Photosynthesis","Digestion","Fermentation"],
answer:"Photosynthesis"
}
},

{
x:1200,
y:250,
sprite:"☣️",
question:{
question:"What is the center of an atom called?",
choices:["Electron","Shell","Nucleus","Cell"],
answer:"Nucleus"
}
}

],

walls:[

{x:300,y:0,w:20,h:850},
{x:700,y:100,w:20,h:850},
{x:1100,y:0,w:20,h:850}

]

}

];

/* VARIABLES */

const gameWorld = document.getElementById("gameWorld");

const hero = document.getElementById("hero");

const boss = document.getElementById("boss");

const treasure = document.getElementById("treasure");

const dialogueBox = document.getElementById("dialogueBox");

const questionText = document.getElementById("questionText");

const choicesDiv = document.getElementById("choices");

const message = document.getElementById("message");

const correctSound = document.getElementById("correctSound");

const wrongSound = document.getElementById("wrongSound");

const bossSound = document.getElementById("bossSound");

let heroX = 40;
let heroY = 40;

let health = 100;
let score = 0;

let currentLevel = 1;

let walls = [];

let enemyElements = [];

let villainsDefeated = 0;

let totalVillains = 0;

let bossDefeated = false;

/* LOAD LEVEL */

function loadLevel(levelNum){

const level = levels[levelNum-1];

gameWorld.style.background = level.color;

document.querySelectorAll(".wall").forEach(w=>w.remove());

document.querySelectorAll(".enemy").forEach(e=>e.remove());

walls = [];
enemyElements = [];

villainsDefeated = 0;

bossDefeated = false;

boss.style.display = "none";

treasure.style.display = "none";

totalVillains = level.enemies.length;

/* WALLS */

level.walls.forEach(w=>{

const wall = document.createElement("div");

wall.classList.add("wall");

wall.style.left = w.x + "px";
wall.style.top = w.y + "px";
wall.style.width = w.w + "px";
wall.style.height = w.h + "px";

gameWorld.appendChild(wall);

walls.push(wall);

});

/* ENEMIES */

level.enemies.forEach(enemyData=>{

const enemy = document.createElement("div");

enemy.classList.add("enemy");

enemy.innerHTML = enemyData.sprite;

enemy.style.left = enemyData.x + "px";
enemy.style.top = enemyData.y + "px";

enemy.questionData = enemyData.question;

gameWorld.appendChild(enemy);

enemyElements.push(enemy);

});

/* BOSS */

boss.innerHTML = level.boss;

boss.style.left = "1450px";
boss.style.top = "700px";

/* TREASURE */

treasure.style.left = "1500px";
treasure.style.top = "120px";

/* RESET HERO */

heroX = 40;
heroY = 40;

updateHero();

updateHUD();

}

/* HUD */

function updateHUD(){

document.getElementById("health").innerText = health;

document.getElementById("score").innerText = score;

document.getElementById("level").innerText = currentLevel;

document.getElementById("villainsDefeated").innerText =
villainsDefeated + "/" + totalVillains;

}

/* HERO */

function updateHero(){

hero.style.left = heroX + "px";

hero.style.top = heroY + "px";

}

/* COLLISION */

function collision(a,b){

const aRect = a.getBoundingClientRect();

const bRect = b.getBoundingClientRect();

return !(

aRect.top > bRect.bottom ||
aRect.bottom < bRect.top ||
aRect.right < bRect.left ||
aRect.left > bRect.right

);

}

/* QUESTIONS */

function askQuestion(enemy){

const q = enemy.questionData;

dialogueBox.style.display = "block";

questionText.innerText = q.question;

choicesDiv.innerHTML = "";

q.choices.forEach(choice=>{

const btn = document.createElement("button");

btn.classList.add("choiceBtn");

btn.innerText = choice;

btn.onclick = ()=>{

if(choice === q.answer){

correctSound.play();

score += 20;

villainsDefeated++;

enemy.remove();

showMessage("Correct!");

if(villainsDefeated === totalVillains){

boss.style.display = "block";

showMessage("All villains defeated! Boss unlocked!");

}

}else{

wrongSound.play();

health -= 15;

showMessage("Incorrect!");

if(health <= 0){

alert("Game Over!");

location.reload();

}

}

updateHUD();

closeDialogue();

};

choicesDiv.appendChild(btn);

});

}

/* CLOSE */

function closeDialogue(){

dialogueBox.style.display = "none";

}

/* MESSAGE */

function showMessage(text){

message.innerText = text;

setTimeout(()=>{

message.innerText = "";

},3000);

}

/* MOVEMENT */

window.addEventListener("keydown",(e)=>{

let speed = 12;

let oldX = heroX;
let oldY = heroY;

if(e.key==="ArrowUp") heroY -= speed;

if(e.key==="ArrowDown") heroY += speed;

if(e.key==="ArrowLeft") heroX -= speed;

if(e.key==="ArrowRight") heroX += speed;

updateHero();

/* WALLS */

walls.forEach(wall=>{

if(collision(hero,wall)){

heroX = oldX;
heroY = oldY;

updateHero();

}

});

/* ENEMIES */

enemyElements.forEach(enemy=>{

if(document.body.contains(enemy) && collision(hero,enemy)){

askQuestion(enemy);

}

});

/* BOSS */

if(villainsDefeated === totalVillains &&
collision(hero,boss) &&
!bossDefeated){

bossSound.play();

boss.style.display = "none";

bossDefeated = true;

treasure.style.display = "block";

score += 100;

showMessage("Boss defeated!");

updateHUD();

}

/* TREASURE */

if(collision(hero,treasure) && bossDefeated){

if(currentLevel < 4){

currentLevel++;

showMessage("Entering Level " + currentLevel);

loadLevel(currentLevel);

}else{

alert("🏆 YOU COMPLETED ALL FOUR MCAS SCIENCE MAZES!");

}

}

});

/* START */

loadLevel(1);

</script>

</body>
</html>
